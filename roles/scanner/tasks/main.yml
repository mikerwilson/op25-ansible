
- name: Update apt cache and upgrade system
  apt:
    update_cache: yes
    upgrade: dist
    cache_valid_time: 3600

- name: Install required dependencies
  apt:
    name:
      - git
      - build-essential
      - cmake
      - pkg-config
      - libusb-1.0-0-dev
      - python3
      - python3-pip
      - python3-dev
      - rtl-sdr
      - sox
      - icecast2
      - wget
      - swig
      - liquidsoap
      - gnuradio
      - gr-osmosdr
    state: present

- name: Create a dedicated 'op25' user
  user:
    name: op25
    comment: "User to run OP25"
    shell: /bin/bash
    create_home: yes

- name: Ensure 'op25' user is part of the 'plugdev' group
  user:
    name: op25
    groups: plugdev
    append: yes

- name: Clone or update Boatbod OP25 fork
  git:
    repo: https://github.com/boatbod/op25.git
    dest: /opt/op25
    update: yes
    force: yes
    version: HEAD

- name: Set correct ownership for OP25 directory
  file:
    path: /opt/op25
    state: directory
    owner: op25
    group: op25
    recurse: yes

- name: Rebuild OP25 if Git repository has been updated
  shell: |
    cd /opt/op25
    ./install.sh
  args:
    chdir: /opt/op25
#  when: op25_repo.changed
  become_user: op25

- name: Create Liquidsoap script for OP25 streaming
  copy:
    dest: /opt/op25/op25.liq
    content: |
      # Liquidsoap script to stream OP25 to Icecast
      set("log.stdout", true)
      set("server.telnet", false)

      # Audio input from OP25
      input_op25 = input.external("/usr/bin/sox -q -t raw -r 8000 -e signed-integer -b 16 -c 1 - -t wav -", restart_on_error=true)

      # Stream to Icecast2
      output.icecast(
        %mp3(bitrate=128),
        host = "localhost",
        port = 8000,
        password = "hackme",
        mount = "op25.mp3",
        name = "OP25 Stream",
        description = "Local P25 Radio Stream",
        genre = "Police Scanner",
        input_op25
      )

- name: Create systemd service for OP25 GNU Radio
  copy:
    dest: /etc/systemd/system/op25.service
    content: |
      [Unit]
      Description=OP25 GNU Radio Receiver
      After=network.target

      [Service]
      User=op25
      Group=op25
      ExecStart=/opt/op25/op25/gr-op25/op25.sh -f 859.4375e6
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Create systemd service for Liquidsoap OP25 stream
  copy:
    dest: /etc/systemd/system/op25-liquidsoap.service
    content: |
      [Unit]
      Description=Liquidsoap OP25 Stream
      After=network.target

      [Service]
      User=op25
      Group=op25
      ExecStart=/usr/bin/liquidsoap /opt/op25/op25.liq
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd and enable OP25 and Liquidsoap services
  systemd:
    daemon_reload: yes
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - op25
    - op25-liquidsoap

- name: Ensure Icecast2 service is enabled and running
  systemd:
    name: icecast2
    enabled: yes
    state: started
