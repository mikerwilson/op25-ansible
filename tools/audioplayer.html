<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone Low Latency Audio Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .player-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            border: 1px solid #333;
        }

        .player-container input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
        }

        .player-container button {
            padding: 10px;
            font-size: 16px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .player-container button:hover {
            background-color: #0056b3;
        }

        .status {
            font-size: 18px;
            margin-top: 10px;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Standalone Low Latency Audio Player</h1>
    <div class="player-container">
        <label for="stream-url">Enter Stream URL:</label>
        <input type="text" id="stream-url" placeholder="http://example.com/stream.mp3">
        <button id="streamButton" onclick="toggleIcecastStream()">Start Stream</button>
        <p class="status" id="status">Status: Not playing</p>
        <p class="status" id="timer">Time Elapsed: 00:00</p>
    </div>

    <script>
        let mediaSource;
        let sourceBuffer;
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');
        const streamButton = document.getElementById('streamButton');
        let timerInterval;

        async function toggleIcecastStream() {
            const streamUrl = document.getElementById('stream-url').value;

            if (!streamUrl) {
                alert('Please enter a valid stream URL.');
                return;
            }

            if (streamButton.classList.contains('playing')) {
                clearInterval(timerInterval);
                status.textContent = 'Status: Not playing';
                timer.textContent = 'Time Elapsed: 00:00';
                streamButton.textContent = 'Start Stream';
                streamButton.classList.remove('playing');
                return;
            }

            try {
                status.textContent = 'Status: Connecting...';
                mediaSource = new MediaSource();
                const audio = new Audio();
                audio.src = URL.createObjectURL(mediaSource);

                mediaSource.addEventListener('sourceopen', async () => {
                    sourceBuffer = mediaSource.addSourceBuffer('audio/mpeg');
                    const response = await fetch(streamUrl);
                    const reader = response.body.getReader();

                    async function read() {
                        const { done, value } = await reader.read();
                        if (done) {
                            mediaSource.endOfStream();
                            return;
                        }
                        sourceBuffer.appendBuffer(value);
                        await read();
                    }
                    await read();
                });

                audio.play();
                streamButton.textContent = 'Stop Stream';
                streamButton.classList.add('playing');
                status.textContent = 'Status: Playing';
                startTimer();
            } catch (error) {
                status.textContent = 'Status: Error - ' + error.message;
                console.error('Error playing stream:', error);
            }
        }

        function startTimer() {
            let seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                const minutes = String(Math.floor(seconds / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                timer.textContent = `Time Elapsed: ${minutes}:${secs}`;
            }, 1000);
        }
    </script>
</body>
</html>
